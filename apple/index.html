<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Энциклопедия Apple</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, sans-serif; /* на iPhone и Mac — фирменный шрифт Apple */
            margin: 0;
            padding: 16px;
            background: var(--tg-theme-secondary-bg-color, #f2f2f7);
            color: var(--tg-theme-text-color, #000000);
        }
        h1 {
            font-size: 28px;
            margin: 8px 0 16px;
        }
        /* Карточка одного продукта */
        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            background: var(--tg-theme-bg-color, #ffffff);
        }
        .card-emoji {
            font-size: 40px;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
        }
        .card-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #8e8e93);
        }
    </style>
</head>
<body>
    <h1>Энциклопедия Apple</h1>

    <!-- Сюда JavaScript вставит карточки -->
    <div id="list"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Массив — это как список в Python: [ ... , ... ]
        // Каждый элемент — объект { ключ: значение }, как словарь в Python
        const products = [
            {
                name: 'Apple I',
                year: 1976,
                category: 'Mac',
                emoji: '🧰',
                short: 'Первый компьютер Apple',
                description: 'Стив Возняк собирал его вручную, а Стив Джобс продавал. Стоил $666.66 и продавался без корпуса — только плата.',
            },
            {
                name: 'Macintosh',
                year: 1984,
                category: 'Mac',
                emoji: '🖥️',
                short: 'Компьютер с мышкой и окнами',
                description: 'Один из первых массовых компьютеров с графическим интерфейсом и мышью вместо одних только текстовых команд.',
            },
            {
                name: 'iPod',
                year: 2001,
                category: 'Гаджеты',
                emoji: '🎵',
                short: '1000 песен в кармане',
                description: 'Музыкальный плеер, который изменил то, как люди слушают музыку. Знаменитое колёсико управления.',
            },
            {
                name: 'iPhone',
                year: 2007,
                category: 'iPhone',
                emoji: '📱',
                short: 'Телефон, плеер и интернет в одном',
                description: 'Стив Джобс представил его как «iPod, телефон и интернет-коммуникатор» в одном устройстве. Большой сенсорный экран без клавиатуры.',
            },
            {
                name: 'iPad',
                year: 2010,
                category: 'iPad',
                emoji: '📲',
                short: 'Планшет между телефоном и ноутбуком',
                description: 'Большой сенсорный экран для чтения, фильмов и игр. Сделал планшеты массовыми.',
            },
        ];

        const list = document.getElementById('list');

        // for ... of — как for product in products: в Python
        let html = '';
        for (const product of products) {
            html += `
                <div class="card">
                    <div class="card-emoji">${product.emoji}</div>
                    <div>
                        <div class="card-name">${product.name}</div>
                        <div class="card-info">${product.year} · ${product.short}</div>
                    </div>
                </div>
            `;
        }
        list.innerHTML = html; // вставляем все карточки на страницу разом
    </script>
</body>
</html>
