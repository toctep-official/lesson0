<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кликер</title>

    <!-- Библиотека от Telegram: даёт доступ к window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Цвета берём из темы Telegram (светлая/тёмная),
           а после запятой — запасной цвет для обычного браузера */
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 24px 16px;
            margin: 0;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            user-select: none; /* чтобы при быстрых тапах не выделялся текст */
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            margin: 16px 0 32px;
        }
        #coin {
            font-size: 120px;
            width: 200px;
            height: 200px;
            border: none;
            border-radius: 50%;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            cursor: pointer;
            transition: transform 0.05s; /* плавность «нажатия» */
        }
        /* :active — пока палец на монетке, она чуть уменьшается */
        #coin:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <h2 id="greeting">Привет!</h2>
    <div id="score">0</div>
    <button id="coin">🪙</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('greeting').textContent = `Привет, ${user.first_name}!`;
        }

        // let — переменная, которую можно менять (как обычная переменная в Python)
        let score = 0;
        let perClick = 1; // сколько очков даёт один тап

        // Находим элементы на странице один раз и запоминаем
        const scoreText = document.getElementById('score');
        const coin = document.getElementById('coin');

        // Что делать при тапе по монетке
        coin.addEventListener('click', () => {
            score += perClick;              // как attempts += 1 в твоей игре
            scoreText.textContent = score;  // показываем новое число на экране
            tg.HapticFeedback.impactOccurred('light'); // лёгкая вибрация телефона
        });
    </script>
</body>
</html>
