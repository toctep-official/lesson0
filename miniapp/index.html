<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кликер</title>

    <!-- Библиотека от Telegram: даёт доступ к window.Telegram.WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 24px 16px;
            margin: 0;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            user-select: none;
        }
        #score {
            font-size: 48px;
            font-weight: bold;
            margin: 16px 0 32px;
        }
        #coin {
            font-size: 120px;
            width: 200px;
            height: 200px;
            border: none;
            border-radius: 50%;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            cursor: pointer;
            transition: transform 0.05s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #coin:active {
            transform: scale(0.9);
        }
        #upgrade {
            margin-top: 32px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: var(--tg-theme-button-text-color, #ffffff);
            background: var(--tg-theme-button-color, #2ea6ff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        #upgrade:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h2 id="greeting">Привет!</h2>
    <div id="score">0</div>
    <button id="coin">🪙</button>
    
    <br>
    <button id="upgrade">Улучшить: +1 за тап (цена 10)</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('greeting').textContent = `Привет, ${user.first_name}!`;
        }

        // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
        let score = 0;
        let perClick = 1; 
        let price = 10;   

        // --- ЭЛЕМЕНТЫ ---
        const scoreText = document.getElementById('score');
        const coin = document.getElementById('coin');
        const upgradeBtn = document.getElementById('upgrade');

        function updateUpgradeText() {
            upgradeBtn.textContent = `Улучшить: +1 за тап (цена ${price})`;
        }

        // Функция сохранения
        function save() {
            const text = JSON.stringify({ score: score, perClick: perClick, price: price });
            tg.CloudStorage.setItem('save', text, (error, success) => {
                if (error) console.error('Ошибка сохранения:', error);
            });
        }

        // --- 1. ЗАГРУЗКА И ЗАПУСК ТАЙМЕРА ---
        tg.CloudStorage.getItem('save', (error, value) => {
            // Восстанавливаем прогресс, если он есть
            if (!error && value) {
                const data = JSON.parse(value);
                score = data.score;
                perClick = data.perClick;
                price = data.price;
                
                scoreText.textContent = score;
                updateUpgradeText();
            }
            
            // ВАЖНО: Таймер автосохранения запускаем только здесь!
            // Теперь мы уверены, что старый прогресс уже загружен в переменные (или его точно нет),
            // и таймер не перезапишет его нулями.
            setInterval(save, 2000);
        });


        // --- 2. ЛОГИКА ИГРЫ ---

        coin.addEventListener('click', () => {
            score += perClick;              
            scoreText.textContent = score;  
            tg.HapticFeedback.impactOccurred('light'); 
        });

        upgradeBtn.addEventListener('click', () => {
            if (score >= price) {
                score -= price;
                scoreText.textContent = score;
                
                perClick += 1;
                price *= 2;
                
                updateUpgradeText();
                tg.HapticFeedback.notificationOccurred('success');
                
                // Мгновенное сохранение после покупки
                save(); 
            } else {
                tg.showAlert('Не хватает очков!');
                tg.HapticFeedback.notificationOccurred('error');
            }
        });
    </script>
</body>
</html>
